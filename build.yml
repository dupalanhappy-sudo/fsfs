name: Build
on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check required project files
        run: |
          missing=0
          for f in gradlew gradlew.bat build.gradle gradle.properties settings.gradle gradle/wrapper/gradle-wrapper.jar src/main/resources/fabric.mod.json; do
            if [ ! -f "$f" ]; then
              echo "Missing: $f"
              missing=1
            fi
          done
          if [ "$missing" -eq 1 ]; then
            echo "Put the template files in the repo root, not inside a subfolder."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: chmod +x gradlew
      - run: ./gradlew build

      - uses: actions/upload-artifact@v4
        with:
          name: hudmod-jar
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
